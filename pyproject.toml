[tool.poetry]
name = "stonks"
version = "0.1.0"
description = ""
authors = ["Simon <spam@esemi.ru>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
redis = {extras = ["hiredis"], version = "^8.0.1"}
pydantic = {extras = ["dotenv"], version = "^2.13.4"}
httpx = "^0.28.1"
lxml = "^6.1.1"
cssselect = "^1.4.0"
aiogram = "^3.29.1"
ujson = "^5.13.0"
aiohttp = {extras = ["speedups"], version = "^3.14.1"}
prettytable = "^3.18.0"
uvloop = "^0.22.1"
pydantic-settings = "^2.14.2"

[tool.poetry.group.dev.dependencies]
respx = "^0.23.1"
pytest-mock = "^3.15.1"
types-requests = "^2.33.0.20260518"
mypy = "^2.2.0"
ruff = "^0.15.21"
vulture = "^2.16"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"


[tool.ruff]
line-length = 125
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # flake8-bugbear
    "C4",        # flake8-comprehensions
    "UP",        # pyupgrade
    "S",         # flake8-bandit
    "N",         # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"app/settings.py" = ["E501"]   # длинные строки в конфиге
"tests/*" = ["S101"]           # assert в тестах — норма

[tool.vulture]
paths = ["app"]
ignore_names = [
    "current_signal", "frame",
    "field_names", "align",
    "czk", "eur", "rub", "usd", "cny",
]

[tool.mypy]
python_version = 3.11
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
